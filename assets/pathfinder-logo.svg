<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- soft footpath dots trailing under the mark, same hue family, lighter tint -->
  <g fill="#99D4C4">
    <circle cx="60" cy="270" r="5"/>
    <circle cx="90" cy="278" r="6"/>
    <circle cx="124" cy="283" r="7"/>
    <circle cx="276" cy="283" r="7"/>
    <circle cx="310" cy="278" r="6"/>
    <circle cx="340" cy="270" r="5"/>
  </g>

  <!-- the "W" path mark: two converging trails meeting at a signpost peak -->
  <polyline
    points="70,150 145,245 200,160 255,245 330,150"
    fill="none"
    stroke="#007560"
    stroke-width="30"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- rounded caps at the two base ends, echoing footsteps setting off -->
  <circle cx="70" cy="150" r="15" fill="#007560"/>
  <circle cx="330" cy="150" r="15" fill="#007560"/>

  <!-- destination pin sitting on the peak: the "you are here / go here" cue -->
  <circle cx="200" cy="150" r="22" fill="#00543F"/>
  <circle cx="200" cy="150" r="9" fill="#CFEFE6"/>

</svg>
